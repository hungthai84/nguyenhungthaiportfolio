<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyễn Hùng Thái - CX & CS Leader Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Ubuntu:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <meta name="description" content="Portfolio & Thư ngỏ của Nguyễn Hùng Thái - Chuyên gia & Trưởng phòng Chăm sóc Khách hàng (Customer Experience & Customer Service Leader)" />
    <meta property="og:title" content="Nguyễn Hùng Thái - CX & CS Leader Portfolio" />
    <meta property="og:description" content="Portfolio & Thư ngỏ của Nguyễn Hùng Thái - Chuyên gia & Trưởng phòng Chăm sóc Khách hàng (Customer Experience & Customer Service Leader)" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var pref = localStorage.getItem('portfolio_theme_pref');
          var root = document.documentElement;
          
          var targetTheme = 'light';
          if (theme === 'dark') {
            targetTheme = pref === 'bento-dark' ? 'bento-dark' : 'navy-dark';
          } else if (theme === 'light') {
            targetTheme = 'light';
          } else if (pref) {
            targetTheme = pref;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            targetTheme = 'navy-dark';
          }

          root.classList.remove(
            'dark', 'theme-light', 'theme-bento-dark', 'theme-navy-dark',
            'theme-nec', 'theme-glass', 'theme-clay', 'theme-glass-vivid',
            'theme-glass-neo', 'theme-glass-neon', 'theme-fintech-glass'
          );
          
          if (targetTheme === 'light') {
            root.setAttribute('data-theme', 'light');
            root.classList.add('theme-light');
          } else {
            root.setAttribute('data-theme', 'dark');
            root.classList.add('dark');
            if (targetTheme === 'bento-dark') {
              root.classList.add('theme-bento-dark');
            } else {
              root.classList.add('theme-navy-dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
